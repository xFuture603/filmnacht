services:
  filmnacht:
    image: ${FILMNACHT_IMAGE:-ghcr.io/xfuture603/filmnacht:latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # Wins over .env, so an old DATABASE_PATH copied from an earlier
      # .env.example cannot move the database off the volume.
      DATABASE_PATH: /data/filmnacht.db
      # Required: the address people open, behind a reverse proxy its public
      # https address. Compose refuses to start without it.
      ORIGIN: ${ORIGIN:?Set ORIGIN in .env to the address people open, e.g. https://filmnacht.example.org}
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - filmnacht-data:/data
    ports:
      # Only reachable from this machine, for a reverse proxy on the host.
      - '127.0.0.1:${FILMNACHT_PORT:-3000}:3000'

volumes:
  filmnacht-data:
